name: Infra

# Terraform do servico (terraform/): ECR, DynamoDB, IRSA, segredos do Mercado Pago, role
# de deploy + access entry no EKS, NLB 8081/8082 e rotas /billing no API Gateway.
#   pull_request (main/develop) -> validar: fmt + validate, SEM credenciais (a trust OIDC
#                                  da oficina-gha-infra so aceita refs/heads/main|develop).
#   push main/develop           -> plan.
#   workflow_dispatch           -> apply, so em main.
# O primeiro apply e manual (workflow_dispatch em main): ele cria a role de deploy cujo
# ARN (output gha_deploy_role_arn, SSM /oficina/billing/deploy_role_arn) vira o secret
# AWS_DEPLOY_ROLE_ARN do cd.yml.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-billing
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.10.5

jobs:
  validar:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (sem backend)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  plan:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      # Role compartilhada oficina-gha-infra (bootstrap do oficina-infra-k8s).
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false -reconfigure

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # So main aplica; qualquer outra ref falha alto. REF entra por env (nunca
      # interpolado no script).
      - name: Verificar branch
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "ERRO: apply so pode rodar em refs/heads/main (ref atual: '$REF')." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      # Nao e segredo; evita abrir o console para preencher AWS_DEPLOY_ROLE_ARN.
      - name: Outputs
        run: |
          terraform -chdir=terraform output -raw gha_deploy_role_arn
          echo
          terraform -chdir=terraform output -raw ecr_repository_url
